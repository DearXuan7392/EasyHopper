plugins {
    id 'easyhopper-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modImplementation "maven.modrinth:yacl:${yacl_version}-fabric"
    modImplementation "maven.modrinth:modmenu:${modmenu_version}"
    modImplementation "maven.modrinth:cloth-config:${cloth_config_version}+fabric"
    include "org.yaml:snakeyaml:${project.snakeyaml_version}"

    // Loom 在 remap 依赖 mod 时会移除 fabric.mod.json 的 jars 字段, 导致其内嵌的库
    // (META-INF/jars) 在开发运行环境中不会被加载. 以下依赖仅用于开发运行, 版本与各 mod
    // 的内嵌版本保持一致, 不会进入构建产物.
    runtimeOnly "org.quiltmc.parsers:gson:${quilt_parsers_version}"
    runtimeOnly "org.quiltmc.parsers:json:${quilt_parsers_version}"
    runtimeOnly "me.shedaniel.cloth:basic-math:${cloth_basic_math_version}"
    runtimeOnly "com.twelvemonkeys.common:common-lang:${twelvemonkeys_version}"
    runtimeOnly "com.twelvemonkeys.common:common-io:${twelvemonkeys_version}"
    runtimeOnly "com.twelvemonkeys.common:common-image:${twelvemonkeys_version}"
    runtimeOnly "com.twelvemonkeys.imageio:imageio-core:${twelvemonkeys_version}"
    runtimeOnly "com.twelvemonkeys.imageio:imageio-metadata:${twelvemonkeys_version}"
    runtimeOnly "com.twelvemonkeys.imageio:imageio-webp:${twelvemonkeys_version}"
}

loom {
    enableTransitiveAccessWideners = false

    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// 实现 mcgradleconventions 加载器属性
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
loom.remapConfigurations.configureEach {
    configurations.named(it.name) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
