# 重要提示:
# 您添加的每个字段都必须同时添加到 buildSrc/src/main/groovy/multiloader-common.gradle 的 expandProps 映射中.

# 项目
version=26.1.0.0
group=com.dearxuan.easyhopper
java_version=25

# 通用
minecraft_version=26.1
mod_name=EasyHopper
mod_author=Jared
mod_id=easyhopper
license=CC0-1.0
credits=
description=您的模组的描述. \n支持多行文本.
minecraft_version_range=[26.1, 26.2)
## 这是 'common' 项目使用的 Minecraft 版本, 您可以在以下网址找到所有版本的列表
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1-1

# Fabric, 查看 https://fabricmc.net/develop/ 获取新版本
fabric_version=0.144.0+26.1
fabric_loader_version=0.18.4

# NeoForge, 查看 https://projects.neoforged.net/neoforged/neoforge 获取新版本
neoforge_version=26.1.0.1-beta
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
