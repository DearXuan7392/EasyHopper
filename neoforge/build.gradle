plugins {
    id 'easyhopper-loader'
    id 'net.neoforged.moddev'
}

dependencies {
    implementation "maven.modrinth:yacl:${yacl_version}-neoforge"
    implementation "maven.modrinth:cloth-config:${cloth_config_version}+neoforge"

    // jarJar 将 snakeyaml 打包进最终 JAR (生产环境), implementation 确保编译期类路径可用
    implementation "org.yaml:snakeyaml:${project.snakeyaml_version}"
    jarJar("org.yaml:snakeyaml:${project.snakeyaml_version}")
}

neoForge {
    version = neoforge_version
    // 如果文件存在, 则自动启用 neoforge AccessTransformer
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // 统一运行配置名称与 fabric 一致
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file("runs/client"))
            // ModDevGradle 开发运行环境 (client/server) 的类路径由 legacyClasspath 文件提供,
            // 普通 implementation 依赖不会进入其中, 因此必须通过 additionalRuntimeClasspath 显式注入,
            // 否则运行时会抛 NoClassDefFoundError: org.yaml.snakeyaml.constructor.BaseConstructor
            additionalRuntimeClasspathConfiguration.dependencies.add(project.dependencies.create("org.yaml:snakeyaml:${project.snakeyaml_version}"))
        }
        data {
            data()
            gameDirectory = this.mkdir(this.file("runs/data"))
            // DataGen 可以在终端中通过 "./gradlew :neoforge:runData" 运行.
            // 指定用于数据生成的 modid, 输出生成的资源的路径, 以及查找现有资源的路径.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file("runs/server").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/server"))
            // 同 client: 将 snakeyaml 注入开发运行时 legacyClasspath, 使服务端加载配置时不缺类
            additionalRuntimeClasspathConfiguration.dependencies.add(project.dependencies.create("org.yaml:snakeyaml:${project.snakeyaml_version}"))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// 实现 mcgradleconventions 加载器属性
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
