pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// 此项设置应与项目的文件夹名称一致, 否则 IDEA 可能会报错 (参见 https://youtrack.jetbrains.com/issue/IDEA-317606) 
rootProject.name = 'EasyHopper'
include('common')
include('fabric')
include('neoforge')
